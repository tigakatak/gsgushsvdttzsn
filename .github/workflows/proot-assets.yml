name: Proot assets

# Rebuilds the prebuilt proot binaries committed under
# app/src/main/jniLibs/arm64-v8a/. The script produces libproot.so and
# libloader.so only (arm64-only app: no 32-bit loader is built, so no
# PROOT_LOADER_32 is exported at runtime either).

on:
  workflow_dispatch:
  push:
    branches: [main, Testing]
    paths:
      - tools/**
      - .github/workflows/proot-assets.yml

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install pinned NDK
        run: sdkmanager "ndk;28.2.13676358"

      - name: Build proot assets (arm64-v8a)
        run: |
          chmod +x tools/build-proot-assets.sh
          tools/build-proot-assets.sh arm64-v8a

      - name: Verify artifacts are arm64 executables
        run: |
          file app/src/main/jniLibs/arm64-v8a/libproot.so | tee /dev/stderr | grep -q aarch64
          file app/src/main/jniLibs/arm64-v8a/libloader.so | tee /dev/stderr | grep -q aarch64

      - uses: actions/upload-artifact@v4
        with:
          name: proot-assets-arm64
          path: |
            app/src/main/jniLibs/arm64-v8a/libproot.so
            app/src/main/jniLibs/arm64-v8a/libloader.so
