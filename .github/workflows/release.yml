name: Release

on:
  workflow_dispatch:

env:
  ALIAS: ${{ secrets.ALIAS }}
  KEYPASS: ${{ secrets.KEYPASS }}
  STOREPASS: ${{ secrets.STOREPASS }}
  STOREFILE: redt-release.jks
  HAS_KEY: ${{ secrets.KEYSTORE_BASE64 != '' }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5.6.0
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Require signing secrets
        if: env.HAS_KEY != 'true'
        run: |
          echo "::error::Signing secrets (ALIAS/KEYPASS/STOREPASS/KEYSTORE_BASE64) are not configured."
          exit 1

      - name: Decode keystore
        if: env.HAS_KEY == 'true'
        run: printf '%s' "$KEYSTORE_BASE64" | base64 -d > app/redt-release.jks
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Verify keystore and key password
        if: env.HAS_KEY == 'true'
        run: |
          keytool -certreq -keystore app/redt-release.jks -alias "${ALIAS}" \
            -storepass "${STOREPASS}" \
            -keypass "${KEYPASS:-$STOREPASS}" > /dev/null
          echo "Keystore and key password OK"


      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Fix gradle.properties for CI
        run: sed -i '/android\.aapt2FromMavenOverride/d' gradle.properties

      - name: Build release APK
        if: env.HAS_KEY == 'true'
        run: ./gradlew assembleRelease
        env:
          KEYSTORE_PASSWORD: ${{ secrets.STOREPASS }}
          KEY_ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEYPASS }}

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Alpiner-signed
          path: app/build/outputs/apk/release/*.apk
