name: Release

on:
  workflow_dispatch:

env:
  ALIAS: ${{ secrets.ALIAS }}
  KEYPASS: ${{ secrets.KEYPASS }}
  STOREPASS: ${{ secrets.STOREPASS }}
  STOREFILE: redt-release.jks
  HAS_KEY: ${{ secrets.KEYSTORE_BASE64 != '' }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5.6.0
        with:
          java-version: "17"
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install NDK 29 and CMake
        run: sdkmanager "ndk;29.0.13846066" "cmake;3.22.1"

      - name: Decode signing keystore
        if: env.HAS_KEY == 'true'
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "app/${STOREFILE}"

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Fix gradle.properties for CI
        run: sed -i '/android\.aapt2FromMavenOverride/d' gradle.properties

      - name: Build release APK
        if: env.HAS_KEY == 'true'
        run: ./gradlew assembleRelease

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RedT-signed
          path: app/build/outputs/apk/release/*.apk
